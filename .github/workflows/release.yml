---
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Release with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Publish Homebrew formula
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          formula="$(find dist -name yago.rb -path '*Formula*' | head -n1)"
          test -n "$formula"
          sed -i '/^  version "/d' "$formula"
          git clone --depth 1 \
            "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/danieleborsaro/homebrew-devops.git" tap
          mkdir -p tap/Formula
          cp "$formula" tap/Formula/yago.rb
          cd tap
          git config user.name "goreleaser"
          git config user.email "bot@goreleaser.com"
          git add Formula/yago.rb
          if git diff --cached --quiet; then
            echo "No formula changes"
          else
            git commit -m "Brew formula update for yago version ${GITHUB_REF_NAME}"
            git push origin main
          fi
