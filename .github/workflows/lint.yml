---
name: Linting

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '**.go'
      - '**.yaml'
      - '**.yml'
      - '.golangci.yml'
      - '.yamllint.yaml'
      - '.pre-commit-config.yaml'

jobs:
  go-lint:
    name: Go Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        # golangci-lint v2 needs v7 or later of the action.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --new-from-rev=origin/main

  yaml-lint:
    name: YAML Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint --format github .

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Gosec Security Scanner
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --default=none --enable=gosec --tests=false --new-from-rev=origin/main

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pre-commit
        run: pip install pre-commit

      # The go-imports and yamlfmt hooks run these binaries, and pre-commit doesn't install them.
      - name: Install goimports and yamlfmt
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.50.0
          go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # gofmt, goimports and go mod tidy come from the hooks. Tests are skipped
      # here because they run in ci.yml and bdd-pr.yml.
      - name: Run pre-commit
        env:
          SKIP: go-unit-tests
        run: pre-commit run --all-files --show-diff-on-failure
