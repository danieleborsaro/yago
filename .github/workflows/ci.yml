---
name: Build and Test

# Unit tests (BDD tests are excluded, see bdd-pr.yml) and the cross-platform
# build, for pull requests. Linting is in lint.yml; the full suite and
# coverage run nightly (coverage.yml).
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select affected packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute affected packages
        id: select
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          result="$(tests/scripts/affected-packages.sh "$base")"
          if [ "$result" = "ALL" ]; then
            packages="./..."
          else
            packages="$(echo "$result" | xargs)"
          fi
          if [ -z "$packages" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  test:
    name: Unit tests
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -skip "BehavioralBDD" ${{ needs.select.outputs.packages }}

  build:
    name: Build
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build cross-platform binaries
        run: make build-cross

  # Single required check for branch protection.
  ci-gate:
    name: CI gate
    if: always()
    needs: [select, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Results: $results"
          case "$results" in
            *failure*|*cancelled*) echo "CI gate failed"; exit 1 ;;
          esac
