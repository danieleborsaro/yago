---
name: BDD Tests (Nightly)

# Full behavioral suite against main, with the race detector.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: bdd-nightly
  cancel-in-progress: false

jobs:
  full-suite:
    name: Run full BDD suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # permissions:
    #   issues: write   # required by the failure-reporting step below

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      - name: Run all behavioral BDD tests
        run: go test -v -race -run "BehavioralBDD" ./... 2>&1 | tee bdd.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-nightly-log
          path: bdd.log
          retention-days: 14

