---
version: 2

project_name: yago

before:
  hooks:
    - go mod tidy

builds:
  - id: yago
    main: ./cmd/yago
    binary: yago
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/danieleborsaro/yago/internal/buildinfo.Version={{ .Version }}
      - -X github.com/danieleborsaro/yago/internal/buildinfo.Commit={{ .Commit }}
      - -X github.com/danieleborsaro/yago/internal/buildinfo.Date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ chore:"
