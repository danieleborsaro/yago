---
schema: 2.0.0
namespace: yago
kind: DesiredState
desiredstate:
  meta:
    is_override_schema_in_config: true
    repo: &desiredstate_default
      git:
        url: git@github.com:danieleborsaro/yago.git
        branch: main
        tag: ''
        watch:
          - tests/assets/2.0.0/desiredstates/foo2/{**,.}/*

    ## NB: this could be removed and just load+assemble the entire subtree by default
    ##     there sould be no need to refrence ouside the three from here
    ##     ohrwise yes we need a parts section for that (maybe just for lsting outside files)
    parts:
      self: tests/assets/2.0.0/desiredstates/foo2/desiredstate.yaml

    orchestration: {}

    pipelines_as_code:
      self:
        is_self_updating: true

      children: []

  components:
    yago:
      git:
        url: git@github.com:danieleborsaro/yago.git
        branch: main
        tag: ""
        path: .
        watch:
          - ./{**,.}/*

      docker:
        eu-west-1:
          image: danieleborsaro/yago
          tag: 2.0.0

  configuration:
    dev:
      terraform:
        git:
          url: git@github.com:danieleborsaro/yago.git
          branch: main
          tag: ""
          path: tests/assets/2.0.0/configurations/foo2/dev/configuration.yaml
          watch:
            - tests/assets/2.0.0/configurations/foo2/dev/{**,.}/*

    pre:
      terraform:
        git:
          url: git@github.com:danieleborsaro/yago.git
          branch: main
          tag: ""
          path: tests/assets/2.0.0/configurations/foo2/pre/configuration.yaml
          watch:
            - tests/assets/2.0.0/configurations/foo2/pre/{**,.}/*

    prod:
      terraform:
        git:
          url: git@github.com:danieleborsaro/yago.git
          branch: main
          tag: ""
          path: tests/assets/2.0.0/configurations/foo2/prod/configuration.yaml
          watch:
            - tests/assets/2.0.0/configurations/foo2/prod/{**,.}/*
