---
desiredstate:
  content:
    components:
      sourcecode:
        terraform:
          url: git@github.com:RedCloudTechnology/tf-root-concourse-cluster.git
          branch: ""
          tag: !!str 20260515.1
          path: .
          watch:
            - ./{**,.}/*

      artifacts:
        nginx:
          docker:
            eu-west-1:
              image: 766870746146.dkr.ecr.eu-west-1.amazonaws.com/utils.tls-termination
              tag: 1.3.0

        concourse_linux:
          docker:
            eu-west-1:
              image: 766870746146.dkr.ecr.eu-west-1.amazonaws.com/cicd.concourse-agent
              # tag: 1.10.0 # Concourse 7.13.1
              tag: 1.13.0 # Concourse 7.14.3

          web:
            eu-west-1:
              uri: https://nexus.devops-assets.red101.tech/repository/external-artifacts/Concourse/concourse-7.14.3-linux-amd64.tgz

          ami:
            eu-west-1:
              owner: amazon
              # name: amzn2-ami-kernel-5.10-hvm-2.0.20251110.1-x86_64-gp2 ## Amazon linux 2
              name: al2023-ami-2023.11.20260413.0-kernel-6.1-x86_64 ## Amazon Linux 3 - find with: aws ssm get-parameter --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64 --query 'Parameter.Value' --output text
              platform: linux

        concourse_windows:
          web:
            eu-west-1:
              # uri: https://nexus.devops-assets.red101.tech/repository/external-artifacts/Concourse/concourse-7.13.1-windows-amd64.zip
              uri: https://nexus.devops-assets.red101.tech/repository/external-artifacts/Concourse/concourse-7.14.3-windows-amd64.zip

          ami:
            eu-west-1:
              owner: !!str 766870746146
              name: ConcourseCI-Worker-Windows-2022_20240212164649 ## Our custom AMI
              platform: windows

      tools:
        terraform: !!str 1.13

    environments:
      all:
        configurations:
          default: &config_default
            url: git@github.com:RedCloudTechnology/gitops-configurations-shared.git
            branch: ''
            tag: !!str 20260515.5
            path: tests/assets/4.2.0/desiredstates/concourse-cluster/configuration.yaml
            watch:
              - tests/assets/4.2.0/desiredstates/concourse-cluster/{**,.}/*
              - cicd/concourse-dev/devops-dev/secrets/validate/{**,.}/*

          terraform:
            !!merge <<: *config_default
          concourse:
            !!merge <<: *config_default
