---
secrets:
  eu-west-1:
    ## *** cluster secrets ***
    pgsql_user_root:
      is_created_here: true
      name: secrets/devops-dev/concourse/postgres/users/admin
      description: Admin credentials to Concourse PostgreSQL backed
      versions:
        version_a: 6324c1f6-e0eb-4066-af51-29059f772d48
      keys:
        username_path: username
        password_path: password_b64

    pgsql_user_service:
      is_created_here: true
      name: secrets/devops-dev/concourse/postgres/users/service
      description: Non-privileged credentials to Concourse PostgreSQL backed
      versions:
        version_a: 15b39e11-1d82-4d76-966b-db70380604dc
      keys:
        username_path: username
        password_path: password_b64

    data_encryption:
      is_created_here: true
      name: secrets/devops-dev/concourse/cluster/data-encryption
      description: |
        Key used to encrypt data.

        KeePass/Enpass 32 character generated.
      versions:
        version_a: 96617e10-7e60-477e-bfee-791d88ef0afd
      keys:
        private_key_path: key_current_b64
        private_key_old_path: key_old_b64

    session_signing:
      is_created_here: true
      name: secrets/devops-dev/concourse/cluster/session-signing
      description: |
        Worker nodes to Web node session signing key.

        openssl genrsa -out key.pem 4096

        or

        ssh-keygen -t rsa -m PEM -b 4096
      versions:
        version_a: 81a24722-4cb1-4e79-9cab-fa2d34c4a59c
      keys:
        private_key_path: private_key_b64 #gitleaks:allow

    atc_ssl:
      is_created_here: true
      name: secrets/devops-dev/concourse/cluster/keys/atc
      description: |
        SSL certificate for secure connections to ATC, via NGINX.

        openssl req -newkey rsa:4096 -nodes -keyout key.pem -x509 -days 365 -out certificate.pem
      versions:
        version_a: 8152ec98-095f-43e0-a463-a0feca5be55f
      keys:
        private_key_path: private_key_b64 #gitleaks:allow
        certificate_path: certificate_b64

    tsa_keys:
      is_created_here: true
      name: secrets/devops-dev/concourse/cluster/keys/tsa
      description: |
        TSA host keys.

        openssl genrsa -out key.pem 4096

        or

        ssh-keygen -t rsa -m PEM -b 4096
      versions:
        version_a: 9962e98c-9a71-47fd-a559-ec5b1cb007ac
      keys:
        private_key_path: private_key_b64 #gitleaks:allow
        public_key_path: public_key

    worker_keys:
      is_created_here: true
      name: secrets/devops-dev/concourse/cluster/keys/worker
      description: |
        Worker node keys.

        openssl genrsa -out key.pem 4096

        or

        ssh-keygen -t rsa -m PEM -b 4096
      versions:
        version_a: 8668799d-0f64-4817-9b60-67183f3999a7
      keys:
        private_key_path: private_key_b64 #gitleaks:allow
        public_key_path: public_key

    administrator:
      is_created_here: true
      name: secrets/devops-dev/concourse/auth/local/admin
      description: Concourse local admin user
      versions:
        version_a: b4223bc2-5ce4-4914-9bf8-83401f17a87d
      keys:
        username_path: username
        password_path: password_b64
        team_path: group

    local_auth:
      is_created_here: true
      name: secrets/devops-dev/concourse/auth/local/users
      description: |
        Credentials of local users, PLAINTEXT storing a JSON list of objects, e.g. [{"username": "user1","password_b64": "cHdkMTIz"},{"username": "user2","password_b64":"cHdkNDU2"}]
      versions:
        version_a: 6bce15de-360c-4316-921b-11ac95c0a753
      keys: {}

    docker_registry_user:
      is_created_here: true
      name: secrets/devops-dev/concourse/cluster/dockerhub/user
      description: Credentials for accessing docker hub account
      versions:
        version_a: 76cb398f-eebd-41ec-9fa7-87ae2f05648f
      keys:
        username_path: username
        password_path: password

    azure_sso:
      is_created_here: true
      name: secrets/devops-dev/concourse/auth/oidc/aad
      description: OIDC secrets for enabling SSO with AAD
      versions:
        version_a: 398bfc80-882a-4e36-9fca-29d0684073d4
      keys:
        tenant_id: tenant_id
        client_id: client_id
        client_secret_b64: client_secret_b64
        issuer_url: issuer_url

    newrelic_api_key:
      is_created_here: true
      name: secrets/devops-dev/concourse/monitoring/newrelic/apikey
      description: API Key for NewRelic Monitoring
      versions:
        version_a: 193adf50-f130-4b42-897d-d61be22c1564
      keys:
        api_key: api_key

    # ssh_user_linux:
    #   is_created_here: true
    #   name: secrets/devops-dev/concourse/cluster/instances/admin/linux
    #   description: |
    #     SSH keys keys.

    #     ssh-keygen -t ED25519
    #   versions:
    #     version_a: AWSCURRENT
    #   keys:
    #     private_key_path: private_key_b64 #gitleaks:allow
    #     public_key_path: public_key

    ssh_user_windows:
      is_created_here: true
      name: secrets/devops-dev/concourse/cluster/instances/admin/windows
      description: |
        SSH keys keys.

        ssh-keygen -t rsa -m PEM -b 4096
      versions:
        version_a: f60dc2d0-f4a3-4d1b-9c83-cf75cf0dd461
      keys:
        private_key_path: private_key_b64 #gitleaks:allow
        public_key_path: public_key
