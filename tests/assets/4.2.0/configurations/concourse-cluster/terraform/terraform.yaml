---
project_properties_env:
  compliance: cicd
  role: clstr

custom_tags: {}
custom_tags_verbatim: {}

keys: {}

remote_states:
  eu-west-1:
    vpc:
      terraform_state:
        bucket: redcloud-d-devops-dev-inception-statefile-euw1
        key: CF929C19-21CA-4491-BD30-CDA24DBCCF78.tfstate
        kms_key_id: a94042a0-458a-4135-ada1-ea11582e47b4
        region: eu-west-1

    dns-zones:
      terraform_state:
        bucket: redcloud-d-devops-dev-inception-statefile-euw1
        key: devops-dev/dnszones/terraform.tfstate
        kms_key_id: a94042a0-458a-4135-ada1-ea11582e47b4
        region: eu-west-1

    persistent_state:
      terraform_state:
        bucket: redcloud-d-devops-dev-inception-statefile-euw1
        key: devops-dev/shared/concourse/state/terraform.tfstate
        kms_key_id: a94042a0-458a-4135-ada1-ea11582e47b4
        region: eu-west-1

vpc_output_name: devops

concourse:
  # friendly_name: devops-dev
  friendly_name: concourse-dev
  hostname: cci
  docker:
    ecs:
      nginx:
        desiredstate_ref: nginx

      concourse:
        desiredstate_ref: concourse_linux

      bridge_gateway: 172.17.0.1

    ec2:
      nginx:
        desiredstate_ref: nginx

      concourse:
        desiredstate_ref: concourse_linux

      bridge_gateway: 172.17.0.1

  https:
    ec2:
      desiredstate_ref: concourse_windows

  monitoring:
    newrelic:
      enabled: true
      account_id: 4304495
      url: https://insights-collector.eu01.nr-data.net
      service_prefix: devops_dev_
      batch_size: 2000
      batch_duration: 60s
      is_compression_disabled: false

  cluster:
    size:
      ec2:
        check_linux:
          instances:
            min: 0
            max: 0
            desired: 0

          service:
            max: 1

          asg:
            instance_warmup: "180"
            target_value: "45.0"

        worker_linux:
          instances:
            min: 6
            max: 6
            desired: 6

          service:
            max: 1

          asg:
            instance_warmup: "180"
            target_value: "45.0"

        worker_windows:
          instances:
            min: 1
            max: 1
            desired: 1

          asg:
            instance_warmup: "180"
            target_value: "80.0"

        on_demand:
          base_capacity: "1"
          percentage_above_base_capacity: "100"

      ecs:
        atc:
          service:
            min: 2
            max: 6
            desired: 3

    resources:
      atc:
        memory: 4096
        cpu_units: 2048

      check_linux:
        limits_memory: 8G
        limits_cpu: "4.0"
        reservations_memory: 2G
        reservations_cpu: "1.0"

      worker_linux:
        limits_memory: 8G
        limits_cpu: "4.0"
        reservations_memory: 2G
        reservations_cpu: "1.0"

  infrastructure:
    atc:
      capacity:
        on_demand:
          min: 1

      profiling:
        ## Worker deployment
        is_use_native_workers: false

        ## Volumes sharing
        is_provision_efs: false
        is_use_efs: false ## use efs or nfs4 drivers
        is_mount_efs_on_host: true ## mount efs on host or containerd usage
        is_use_bind_mounts: true
        is_use_ebs_for_docker: true

        ## Standard settings
        is_enable_global_resources: true
        is_enable_cache_streamed_volumes: true
        is_enable_volume_peering: false ## This won't work until we use native workers
        volume_peering_timeout: 8m
        volume_peering_max_size: 2500
        max_active_tasks_per_worker: 150 ## 0 == no limit?
        max_active_containers_per_worker: 900 ## 5 per active task
        max_containers_per_worker: 1000 ## 5 per active task
        max_containers_per_check: 1000 ## 5 per active task
        max_volumes_per_worker: 600 ## based on disk size
        resource_checking_interval: 1m
        global_resource_checking_interval: 1m
        resource_with_webhook_checking_interval: 1m
        containerd_request_timeout: 1m
        baggageclaim_response_header_timeout: 1m
        ## NB: (60 + 20 + 5 + 1 + 1) * var.concourse.cluster.size.ecs.atc.{desired, max} = max RDS connections
        max_api_connections: 60
        max_db_connections: 20

        ## NB: https://concourse-ci.org/container-placement.html
        container_placement_strategies:
          - volume-locality
          - limit-active-containers
          # - limit-active-volumes
          # - fewest-build-containers

    check-ec2:
      size:
        - c6a.xlarge

      ami:
        desiredstate_ref: concourse_linux

    linux-ec2:
      size:
        - m6i.xlarge
        - r6i.xlarge

      ami:
        desiredstate_ref: concourse_linux

    windows:
      size:
        - m6i.xlarge
        - r6i.xlarge

      ami:
        desiredstate_ref: concourse_windows

    subnets:
      eu-west-1:
        name: main_services
        zone_refs:
          - eu-west-1a
          - eu-west-1b

    logging:
      awslogs_stream_prefix_instance: ""
      retention_in_days: 30
      log_level: info


  secrets_manager:
    custom_path_prefix:
      domain: secrets/devops-dev/concourse
      domain_pipelines: secrets/devops-dev/concourse/pipelines
      templates:
        team: "{%raw%}{{.Team}}/{{.Secret}}{%endraw%}"
        pipeline: "{%raw%}{{.Team}}/{{.Pipeline}}/{{.Secret}}{%endraw%}"

  services:
    ssh:
      protocol: tcp
      port: 22

    atc_native:
      protocol: tcp
      port: 8080

    atc_plain:
      protocol: tcp
      port: 80

    atc_secure:
      protocol: tcp
      port: 443

    tsa:
      protocol: tcp
      port: 2222

    garden_debug:
      protocol: tcp
      port: 7776

    garden:
      protocol: tcp
      port: 7777

    baggageclaim_debug:
      protocol: tcp
      port: 7787

    baggageclaim:
      protocol: tcp
      port: 7788

    reaper:
      protocol: tcp
      port: 7799

    healthcheck:
      protocol: tcp
      port: 8888

  authentication:
    oidc:
      is_enabled: true

lb:
  is_internal: true
  subnets:
    eu-west-1:
      name: main_services
      zone_refs:
        - eu-west-1a
        - eu-west-1b

  security:
    policy: ELBSecurityPolicy-TLS13-1-2-2021-06

  services:
    atc_secure:
      port: 443
      protocol:
        sg: tcp
        lb: TCP

    atc_plain:
      port: 80
      protocol:
        sg: tcp
        lb: TCP

    tsa:
      port: 2222
      protocol:
        sg: tcp
        lb: TCP

  timeouts:
    idle: 30
    deregistration_delay: 10
    interval: 6
    timeout: 5
    healthy_threshold: 2
    unhealthy_threshold: 10

  health_check:
    path: /api/v1/info
    matcher: "200,302,405"

  logging:
    log_group:
      retention_in_days: 180

    log_bucket:
      intelligent_tiering:
        transition_in_days: 30

      glacier:
        transition_in_days: 60

      expiration:
        expiration_in_days: 180
